<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="coconutShell" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8d5b32"/>
      <stop offset="60%" stop-color="#5a381e"/>
      <stop offset="100%" stop-color="#3b2311"/>
    </radialGradient>
    <radialGradient id="coconutMeat" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#dfcfb8"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="96" height="96" rx="18" fill="#1e293b" fill-opacity="0.1"/>
  <g filter="url(#shadow)">
    <!-- Main Coconut Body -->
    <ellipse cx="48" cy="50" rx="34" ry="32" fill="url(#coconutShell)" stroke="#2b180a" stroke-width="2"/>
    <!-- Fibrous lines -->
    <path d="M48 20 C42 35, 42 65, 48 80" stroke="#704423" stroke-width="1.5" fill="none"/>
    <path d="M34 26 C26 40, 26 62, 34 74" stroke="#704423" stroke-width="1.5" fill="none"/>
    <path d="M62 26 C70 40, 70 62, 62 74" stroke="#704423" stroke-width="1.5" fill="none"/>
    <!-- Coconut Eyes -->
    <circle cx="42" cy="38" r="4" fill="#241408"/>
    <circle cx="54" cy="38" r="4" fill="#241408"/>
    <circle cx="48" cy="46" r="4" fill="#241408"/>
    <!-- Green sprout leaf -->
    <path d="M48 18 C46 8, 36 6, 32 10 C36 14, 42 16, 48 18 Z" fill="#4ade80" stroke="#166534" stroke-width="1.5"/>
    <path d="M48 18 C50 8, 60 6, 64 10 C60 14, 54 16, 48 18 Z" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  </g>
</svg>
